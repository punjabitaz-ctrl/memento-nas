# Memento v2.0 NAS Edition: primary Docker Compose
#
#   1. sh generate-key.sh              # creates .env with a fresh MEMENTO_KEY + SESSION_SECRET
#   2. set MEMENTO_DATA in .env        # e.g. /volume1/docker/memento (Synology) or /share/Container/memento (QNAP)
#   3. docker compose up -d --build
#   4. open http://<nas-ip>:3002       # first visit shows the owner setup screen
#
# Everything lives in ONE folder (MEMENTO_DATA): db/ vault/ sessions/ tmp/.
# Back that folder up together with your MEMENTO_KEY.

services:
  memento:
    build:
      context: .
      dockerfile: Dockerfile
    image: memento-nas:2.0.0
    container_name: memento
    env_file: .env

    # Run as the user that owns MEMENTO_DATA. On Synology/QNAP set PUID/PGID in .env
    # to the owner of the folder (find it with `ls -ln <folder>`); default is the image's "node" user.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${HOST_PORT:-3002}:3002"

    volumes:
      - ${MEMENTO_DATA:-./data}:/data

    restart: unless-stopped

    # Recommended: 512 MB. Memory use is flat even for multi-GB videos because files stream in 64 KiB chunks.
    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Gives the server time to finish in-flight uploads and close SQLite cleanly.
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
